# SI-generated: Claude Code (Anthropic) — see SI-DISCLOSURE.md
name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  gate:
    name: build, JavaScript tests, Python tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci --no-audit --no-fund
      # tests/test_terrain_coarse.py imports NumPy (scripts/terrain_coarse.py: block means of the LOLA grids); same version as the data was built with.
      - run: python -m pip install --quiet numpy==2.5.2
      - run: bash scripts/gerbang-ujian.sh
