# SI-generated: Claude Code (Anthropic) — see SI-DISCLOSURE.md
# Headers every server AND location block repeats: nginx drops inherited add_header lines as soon as a block declares its own.
# Cache-Control is not here (it differs per path).
add_header X-Frame-Options DENY always;
add_header X-Content-Type-Options nosniff always;
add_header Referrer-Policy no-referrer always;
# The site makes no runtime requests to other hosts (frozen data, self-hosted fonts and scripts); CSP enforces it in the browser.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; worker-src 'self' blob:; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
