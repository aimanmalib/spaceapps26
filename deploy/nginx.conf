# SI-generated: Claude Code (Anthropic) — see SI-DISCLOSURE.md
# Static site. Root = deploy/live (read-only bind, filled by deploy/pasang.sh from the Vite build).
server {
    listen 80 default_server;
    server_name _;
    root /srv/site;
    index index.html;
    charset utf-8;
    server_tokens off;
    autoindex off;
    # Relative redirects (behind the reverse proxy nginx would otherwise write http://…:80).
    absolute_redirect off;

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types text/plain text/css application/javascript text/javascript application/json image/svg+xml;

    include /etc/nginx/headers.conf;
    add_header Cache-Control "no-cache, no-transform" always;

    location / {
        include /etc/nginx/headers.conf;
        add_header Cache-Control "no-cache, no-transform" always;
        try_files $uri $uri.html $uri/index.html =404;
    }
    # Vite writes content-hashed file names into /assets/: safe to cache for a year.
    location /assets/ {
        include /etc/nginx/headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }
    # Hidden files are never served.
    location ~ /\. {
        include /etc/nginx/headers.conf;
        return 404;
    }
}
